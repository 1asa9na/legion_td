# The server already runs Caddy on 80/443. This stack does not publish those ports.
# Attach that Caddy to the external network `edge` once:
#   docker network connect edge <caddy-container>
# and add deploy/host.caddy to its config. The web container is reachable there
# as legion-td-web.
# From the repo root, with .env filled from .env.example:
#   docker compose --env-file .env -f deploy/docker-compose.yml up --build
name: legion-td

services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    environment:
      PORT: "2567"
      BOT_TOKEN: ${BOT_TOKEN:-}
      WEBAPP_URL: ${WEBAPP_URL:-}
    restart: unless-stopped
    expose:
      - "2567"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:2567/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      default: {}
      edge:
        aliases:
          - legion-td-web

networks:
  edge:
    external: true
    name: edge
